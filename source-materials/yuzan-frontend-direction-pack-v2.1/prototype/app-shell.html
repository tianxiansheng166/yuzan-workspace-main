<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教师工作台｜语赞心声设计方向原型</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#">
        <img src="../references/legacy/logo.png" alt="">
        <strong>语赞心声</strong>
      </a>
      <nav class="side-nav" aria-label="教师导航">
        <a class="active" href="#">教学概览</a>
        <a href="#">课程工作台</a>
        <a href="#">教学任务</a>
        <a href="#">提交复核</a>
        <a href="#">学生成长</a>
        <a href="#">离线与同步</a>
      </nav>
    </aside>

    <main class="workspace">
      <header class="workspace-header">
        <div class="context">
          <strong>高原学校 · 五年级一班</strong><br>
          <small>教师工作台</small>
        </div>
        <button class="btn btn-secondary">切换学校</button>
        <button class="btn btn-primary">新建任务</button>
      </header>

      <div class="workspace-main">
        <section class="workspace-title">
          <h1>今天需要处理的教学工作</h1>
          <p>优先显示待发布、待复核和需要关注的学习任务。</p>
        </section>

        <div class="toolbar">
          <button class="btn btn-secondary">全部班级</button>
          <button class="btn btn-secondary">本周</button>
          <button class="btn btn-secondary">筛选状态</button>
        </div>

        <div class="data-layout">
          <table class="table">
            <thead>
              <tr><th>任务</th><th>班级</th><th>状态</th><th>截止</th><th>提交</th></tr>
            </thead>
            <tbody>
              <tr><td>朗读：高原上的春天</td><td>五年级一班</td><td>待复核</td><td>今天 18:00</td><td>18 / 24</td></tr>
              <tr><td>词语积累练习</td><td>五年级二班</td><td>进行中</td><td>明天</td><td>12 / 22</td></tr>
              <tr><td>阅读理解：青稞的一年</td><td>六年级一班</td><td>草稿</td><td>未发布</td><td>—</td></tr>
            </tbody>
          </table>

          <aside class="side-panel">
            <h2>需要关注</h2>
            <p>五年级一班有 6 名学生尚未完成朗读任务，其中 2 名设备处于待同步状态。</p>
            <button class="btn btn-green">查看并跟进</button>
          </aside>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
