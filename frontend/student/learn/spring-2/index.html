<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>课程学习｜语赞心声</title>
  <script>
    // 兼容旧路径 /student/learn/spring-2 → /student/courses/course-detail/?id=xxx
    (function () {
      var params = new URLSearchParams(window.location.search);
      var assignmentId = params.get('id') || params.get('assignmentId') || '';
      var activityId = params.get('activityId') || '';
      var target = '/student/courses/course-detail/';
      var qp = [];
      if (assignmentId) qp.push('id=' + encodeURIComponent(assignmentId));
      if (activityId) qp.push('activityId=' + encodeURIComponent(activityId));
      if (qp.length) target += '?' + qp.join('&');
      window.location.replace(target);
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=/student/courses/">
  </noscript>
</head>
<body>
  <p style="text-align:center;padding:4em 1em;font-family:sans-serif;color:#555;">
    正在跳转到课程详情页…<br>
    <a href="/student/courses/">如未自动跳转，请点击此处</a>
  </p>
</body>
</html>
