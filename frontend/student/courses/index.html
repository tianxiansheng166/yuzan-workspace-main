<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#eef3fa" />
  <title>课程中心｜语赞心声</title>
  <link rel="stylesheet" href="/assets/common.css" />
  <link rel="stylesheet" href="/shared/student-nav.css" />
  <link rel="stylesheet" href="/student/courses/style.css" />
</head>
<body>
  <main class="cc-page" id="coursePage">
    <section class="cc-hero">
      <div class="cc-hero-overlay" aria-hidden="true"></div>
      <div class="cc-hero-inner">
        <div>
          <p class="cc-hero-kicker">LEARNING LIBRARY</p>
          <h1 class="cc-hero-title">课程中心</h1>
          <p class="cc-hero-sub">找到适合现在的课程，一步一步学下去</p>
        </div>
        <nav class="cc-breadcrumb" aria-label="面包屑">
          <a href="/student/today">首页</a>
          <span aria-hidden="true">/</span>
          <span aria-current="page">课程中心</span>
        </nav>
      </div>
    </section>

    <section id="catalogLoading" class="cc-initial-state" role="status" aria-live="polite">
      <span class="cc-loader" aria-hidden="true"></span>
      <div>
        <strong>正在打开课程目录</strong>
        <p>正在为你整理可学习的课程…</p>
      </div>
    </section>
    <section id="catalogState" class="cc-initial-state cc-initial-state--error" role="alert" hidden></section>

    <div id="catalogContent" class="cc-catalog" hidden>
      <header class="cc-catalog-heading">
        <div>
          <p class="cc-eyebrow">为你开放的学习内容</p>
          <h2>挑一门课程，开始今天的进步</h2>
        </div>
        <p class="cc-heading-note">课程、进度与收藏均来自你的学习账户</p>
      </header>

      <div id="networkNotice" class="cc-network-notice" role="status" aria-live="polite" hidden>
        <span class="cc-network-mark" aria-hidden="true"></span>
        <p id="networkMessage"></p>
        <button id="networkRetry" class="cc-text-button" type="button">重试加载</button>
      </div>

      <div class="cc-layout">
        <aside class="cc-sidebar" aria-label="课程筛选条件">
          <div class="cc-sidebar-heading">
            <span class="cc-sidebar-mark" aria-hidden="true"></span>
            <h2>筛选课程</h2>
          </div>

          <div class="cc-filter-group">
            <label class="cc-filter-label" for="gradeFilter">年级与学段</label>
            <select id="gradeFilter" class="cc-select">
              <option value="">全部年级</option>
            </select>
          </div>

          <div class="cc-filter-group">
            <label class="cc-filter-label" for="categoryFilter">课程类别</label>
            <select id="categoryFilter" class="cc-select">
              <option value="">全部类别</option>
            </select>
          </div>

          <div class="cc-filter-group">
            <label class="cc-filter-label" for="difficultyFilter">难度</label>
            <select id="difficultyFilter" class="cc-select">
              <option value="">全部难度</option>
            </select>
          </div>

          <div class="cc-filter-group">
            <label class="cc-filter-label" for="taskGroupFilter">学习任务群</label>
            <input id="taskGroupFilter" class="cc-input" type="search" placeholder="输入任务群名称" autocomplete="off" />
          </div>

          <div class="cc-filter-group">
            <label class="cc-filter-label" for="culturalFilter">文化元素</label>
            <input id="culturalFilter" class="cc-input" type="search" placeholder="输入文化元素" autocomplete="off" />
          </div>

          <button id="clearAllFilters" class="cc-clear-button" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M8 5V3.5h4V5m2.5 0-.7 11H6.2l-.7-11M8.2 8v5.5m3.6-5.5v5.5" /></svg>
            清除全部条件
          </button>
        </aside>

        <section class="cc-main" aria-label="课程列表">
          <form id="searchForm" class="cc-search-bar" role="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 4.2 4.2"/></svg>
            <label class="cc-visually-hidden" for="searchInput">搜索课程名称</label>
            <input id="searchInput" type="search" placeholder="搜索课程名称" autocomplete="off" />
            <button class="cc-search-button" type="submit">搜索课程</button>
          </form>

          <div id="activeTags" class="cc-active-tags" aria-label="已应用的筛选条件" hidden></div>

          <div class="cc-toolbar">
            <div class="cc-sort-control">
              <label for="sortSelect">排序</label>
              <select id="sortSelect" class="cc-select cc-select--compact">
                <option value="publishedAt">最新发布</option>
                <option value="popularity">最受欢迎</option>
              </select>
            </div>
            <div class="cc-view-control" role="group" aria-label="课程显示方式">
              <button type="button" class="cc-view-button is-active" data-view="grid" aria-label="卡片视图" aria-pressed="true">
                <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="2.5" width="6" height="6" rx="1"/><rect x="11.5" y="2.5" width="6" height="6" rx="1"/><rect x="2.5" y="11.5" width="6" height="6" rx="1"/><rect x="11.5" y="11.5" width="6" height="6" rx="1"/></svg>
              </button>
              <button type="button" class="cc-view-button" data-view="list" aria-label="紧凑列表视图" aria-pressed="false">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4h10M7.5 10h10M7.5 16h10M3 4h.01M3 10h.01M3 16h.01"/></svg>
              </button>
            </div>
            <p id="resultCount" class="cc-result-count" aria-live="polite">正在加载…</p>
          </div>

          <div id="gridLoading" class="cc-grid-loading" role="status" aria-live="polite" hidden>
            <span class="cc-loader cc-loader--small" aria-hidden="true"></span>
            正在更新课程目录…
          </div>
          <div id="requestError" class="cc-request-error" role="alert" hidden></div>
          <div id="courseGrid" class="cc-grid" aria-live="polite" aria-busy="false"></div>

          <section id="emptyState" class="cc-empty-state" aria-live="polite" hidden>
            <svg viewBox="0 0 56 56" aria-hidden="true"><path d="M9 14.5c6.5-2 13.1-.6 19 4v25c-5.9-4.6-12.5-6-19-4v-25Zm38 0c-6.5-2-13.1-.6-19 4v25c5.9-4.6 12.5-6 19-4v-25Z"/><path d="M14 20h8m-8 5h8m12-5h8m-8 5h8"/></svg>
            <p class="cc-eyebrow">换个方向继续找</p>
            <h3>没有找到符合条件的课程</h3>
            <p>调整年级、类别或关键词，再看看课程目录。</p>
            <button id="clearEmptyFilters" class="cc-outline-button" type="button">清除筛选条件</button>
          </section>

          <div id="loadMore" class="cc-load-more" hidden>
            <span class="cc-load-more-rule" aria-hidden="true"></span>
            <button id="loadMoreBtn" class="cc-outline-button" type="button">加载更多课程</button>
            <span class="cc-load-more-rule" aria-hidden="true"></span>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div id="toast" class="cc-toast" role="status" aria-live="polite" hidden></div>
  <script src="/assets/app-core.js"></script>
  <script src="/assets/api-client.js"></script>
  <script src="/assets/visual-assets.js"></script>
  <script src="/student/courses/courses.js"></script>
  <script src="/shared/student-nav.js"></script>
</body>
</html>
