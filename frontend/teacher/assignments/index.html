<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教学任务｜语赞心声</title><link rel="stylesheet" href="/assets/common.css"><link rel="stylesheet" href="/teacher/assignments/style.css"><link rel="stylesheet" href="/shared/teacher-shell.css" />
  <body><div class="viewport"><main class="design assignments" data-width="1672" data-height="941">
<aside class="sidebar"><img class="logo brand-logo-clean" src="/assets/teacher-logo-assign.png" alt="语赞心声"><nav>
<a class="active" data-nav="/teacher/courses/">▣ <span>课程工作台</span></a><a data-unsupported="学习路径功能暂未开通">⌘ <span>学习路径</span></a><a data-nav="/teacher/assessments">◉ <span>智能测评</span></a><a data-nav="/teacher/students/">♧ <span>学生管理</span></a><a data-unsupported="资源中心功能暂未开通">▱ <span>资源中心</span></a><a data-unsupported="教师支持功能暂未开通">♙ <span>教师支持</span></a><a data-unsupported="公益与志愿功能暂未开通">♢ <span>公益与志愿</span></a><a data-unsupported="离线管理功能暂未开通">▻ <span>离线管理</span></a><a data-unsupported="数据概览功能暂未开通">▥ <span>数据概览</span></a><a data-unsupported="消息中心功能暂未开通">♧ <span>消息中心</span></a><a data-unsupported="账户设置功能暂未开通">⚙ <span>账户设置</span></a>
</nav><div class="side-art"></div></aside>
<header class="topbar"><div>课程工作台　›　<b>教学任务</b></div><div class="tools">◎　<span>⌁</span>　♧　<i></i>　⌄</div></header>
<section class="main"><div class="heading"><h1>教学任务</h1><div class="filters" aria-label="任务筛选"><input id="assignmentSearch" type="search" placeholder="搜索任务名称" aria-label="搜索任务名称"><select id="assignmentClassFilter" aria-label="班级"><option value="">全部班级</option></select><select id="assignmentStatusFilter" aria-label="状态"><option value="">全部状态</option><option value="OPEN">已发布</option><option value="DRAFT">已保存草稿</option><option value="SCHEDULED">已排期</option><option value="CLOSED">已结束</option><option value="CANCELLED">已取消</option></select><label class="date-filter">截止从<input id="assignmentDueFrom" type="date" aria-label="截止日期从"></label><label class="date-filter">到<input id="assignmentDueTo" type="date" aria-label="截止日期到"></label><button id="reloadAssignments" type="button">重新加载</button><button class="new">＋ 新建任务</button></div></div>
<div class="task-table"><div class="thead"><span>任务</span><span>班级</span><span>截止时间</span><span>已提交</span><span>状态</span><span>操作</span></div>
<div class="row empty-row"><span style="grid-column:1 / -1;text-align:center;color:#888;padding:24px 0;">加载中…</span></div>
<div class="pager"><span data-page-label>当前页 0 条</span><div><button type="button" data-page-prev disabled>上一页</button><b data-page-number>1</b><button type="button" data-page-next disabled>下一页</button><span data-page-more></span></div></div></div>
<aside class="attention-card"><header><h2>任务与复核动态</h2></header><div class="attention-summary"><button type="button" data-kind="open"><b id="attentionOpenCount">—</b> 个进行中</button><button type="button" data-kind="missing"><b id="attentionMissingCount">—</b> 个目标未提交</button><button type="button" data-kind="review"><b id="attentionReviewCount">—</b> 份待复核</button></div><ol id="attentionList"><li><i>…</i><div><h3>正在读取任务统计</h3><p>统计来自当前教师可访问的任务和提交记录。</p></div></li></ol><div class="attention-mountain"></div></aside></section>
<dialog id="modal"><form method="dialog" id="taskForm"><button class="close" value="cancel" aria-label="关闭">×</button><h2>新建教学任务</h2><label>任务名称<input name="title" value="朗读练习" required maxlength="40"></label><label>已发布课程<select name="courseVersionId" required></select></label><label>班级<select name="classId" required><option value="">加载中…</option></select></label><label>开始时间<input name="startsAt" type="datetime-local" required></label><label>截止时间<input name="deadline" type="datetime-local" required></label><p class="dialog-error" role="alert"></p><button class="save" value="default">保存草稿</button></form></dialog>
</main></div><script src="/assets/app-core.js"></script><script src="/assets/api-client.js"></script><script src="/assets/fit.js"></script><script src="/teacher/assignments/app.js"></script><script src="/global-nav.js"></script>  <script src="/shared/teacher-shell.js" defer></script>
</html>
