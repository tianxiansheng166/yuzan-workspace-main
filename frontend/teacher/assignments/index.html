<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教学任务｜语赞心声</title><link rel="stylesheet" href="/shared/teacher-shell.css"><link rel="stylesheet" href="/teacher/assignments/style.css"></head><body>
<main class="task-page"><header class="task-intro"><div><p class="eyebrow">教师工作台 / 教学任务</p><h1>教学任务</h1><p>选择课程与班级，保存草稿后发布给学生。</p></div><div class="intro-actions"><a href="/teacher/courses/">查看课程</a><button class="primary" id="new-task">＋ 新建任务</button></div></header>
<section class="summary" aria-label="任务概览"><div><span>全部任务</span><strong id="total">—</strong><small>当前学校可见任务</small></div><div><span>待发布</span><strong id="drafts">—</strong><small>学生暂不可见</small></div><div><span>进行中</span><strong id="open">—</strong><small>已开放给学生</small></div></section>
<section class="task-list"><div class="list-head"><div><h2>任务列表</h2><p>按班级或状态查找教学任务。</p></div><div class="filters"><label>班级<select id="class-filter"><option value="">全部班级</option></select></label><label>状态<select id="status-filter"><option value="">全部状态</option><option value="DRAFT">草稿</option><option value="SCHEDULED">已排期</option><option value="OPEN">进行中</option><option value="CLOSED">已结束</option><option value="CANCELLED">已取消</option></select></label></div></div><div id="task-results" aria-live="polite" class="results">正在加载任务…</div></section>
<dialog id="task-dialog"><form id="task-form"><header><div><p class="eyebrow">新建教学任务</p><h2>安排课程学习</h2><p>先保存草稿，再确认发布给学生。</p></div><button type="button" id="close-dialog" aria-label="关闭">×</button></header><label>任务名称<input name="title" maxlength="100" required placeholder="例如：本周朗读练习"></label><label>课程<select name="courseVersionId" required><option value="">请选择已发布课程</option></select><small>学生将学习课程中的活动与练习。</small></label><label>班级<select name="classId" required><option value="">请选择任教班级</option></select></label><label>截止时间<input name="deadline" type="datetime-local" required></label><p class="form-error" id="form-error" role="alert"></p><footer><button type="button" class="cancel" id="cancel-dialog">取消</button><button class="primary" type="submit">保存草稿</button></footer></form></dialog></main>
<script src="/assets/api-client.js"></script><script src="/teacher/assignments/app.js" defer></script><script src="/shared/teacher-shell.js" defer></script></body></html>
