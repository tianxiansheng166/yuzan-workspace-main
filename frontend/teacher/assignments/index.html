<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教学任务｜语赞心声</title><link rel="stylesheet" href="/shared/teacher-shell.css"><link rel="stylesheet" href="/teacher/assignments/style.css"></head><body>
<main class="task-page"><div class="breadcrumb">教师工作台 <span>/</span> 教学任务</div><header class="task-intro"><div><p class="eyebrow">TEACHING IN PROGRESS</p><h1>让学习，持续发生。</h1><p>每一个教学任务，都连接着课堂与学生的成长。</p></div><div class="intro-actions"><a href="/teacher/courses/">课程中心 ↗</a><button class="primary" id="new-task">＋ 创建教学任务</button></div></header>
<section class="task-overview"><div class="overview-copy"><span class="overview-label"><i></i> 我的教学工作</span><h2>把每一步，<br>安排得更从容。</h2><p>从课程出发，布置练习、关注学生进度，再将反馈带回课堂。</p><a href="#task-list">查看全部任务 ↘</a></div><div class="overview-stats"><div><span>全部任务</span><strong id="total">—</strong><small>教学任务总数</small></div><div><span>进行中</span><strong id="open">—</strong><small>学生正在学习</small></div><div><span>待发布</span><strong id="drafts">—</strong><small>等待安排给班级</small></div></div></section>
<section class="task-list" id="task-list"><div class="list-head"><div><p class="eyebrow">TASK WORKSPACE / 任务工作区</p><h2>关注每一次学习</h2><p id="task-count">查看任务与学生完成情况。</p></div><div class="filters"><label><span>搜索任务</span><input id="task-search" type="search" placeholder="输入任务名称"></label><label><span>班级</span><select id="class-filter"><option value="">全部班级</option></select></label><label><span>状态</span><select id="status-filter"><option value="">全部状态</option><option value="DRAFT">待发布</option><option value="OPEN">进行中</option><option value="CLOSED">已结束</option></select></label></div></div><div id="task-results" aria-live="polite" class="results"></div></section>
<dialog id="task-dialog"><form id="task-form"><header><div><p class="eyebrow">创建教学任务</p><h2>安排课程学习</h2><p>选择课程与班级，先保存草稿再发布。</p></div><button type="button" id="close-dialog" aria-label="关闭">×</button></header><label>任务名称<input name="title" maxlength="100" required placeholder="例如：本周朗读练习"></label><label>课程<select name="courseVersionId" required><option value="">请选择课程</option></select><small>学生将学习课程中的活动与练习。</small></label><label>班级<select name="classId" required><option value="">请选择班级</option></select></label><label>截止时间<input name="deadline" type="datetime-local" required></label><p class="form-error" id="form-error" role="alert"></p><footer><button type="button" class="cancel" id="cancel-dialog">取消</button><button class="primary" type="submit">保存草稿</button></footer></form></dialog>
<dialog id="detail-dialog"><div class="detail-content"><button type="button" id="close-detail" aria-label="关闭">×</button><div id="task-detail"></div></div></dialog></main>
<script src="/assets/api-client.js"></script><script src="/teacher/showcase-data.js"></script><script src="/teacher/assignments/app.js" defer></script><script src="/shared/teacher-shell.js" defer></script></body></html>
