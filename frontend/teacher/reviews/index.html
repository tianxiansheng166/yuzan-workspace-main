<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>复核队列｜语赞心声</title>
  <link rel="stylesheet" href="/assets/common.css">
  <link rel="stylesheet" href="/teacher/reviews/style.css">
  <link rel="stylesheet" href="/shared/teacher-shell.css">
</head>
<body>
  <div class="app-shell">
    <main class="content">
      <section class="review-queue" aria-labelledby="queue-title">
        <header class="queue-header">
          <div>
            <p class="eyebrow">学习证据 / 教师复核</p>
            <h1 id="queue-title">真实复核队列</h1>
            <p>这里仅显示服务端返回的学生提交。进入详情后再查看证据并作出决定。</p>
          </div>
          <button id="refreshQueue" type="button">刷新队列</button>
        </header>

        <div class="queue-status" id="queueStatus" role="status" aria-live="polite">正在读取任务与提交…</div>
        <div class="queue-list" id="queueList" aria-busy="true"></div>
      </section>
    </main>
  </div>

  <script src="/assets/app-core.js"></script>
  <script src="/assets/api-client.js"></script>
  <script src="/teacher/reviews/app.js"></script>
  <script src="/shared/teacher-shell.js" defer></script>
</body>
</html>
