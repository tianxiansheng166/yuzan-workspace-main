<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fbfaf7" />
  <title>我的班级｜语赞心声</title>
  <link rel="stylesheet" href="./styles.css" />
<link rel="stylesheet" href="/shared/teacher-shell.css" />
  
<body>
  <div class="app-shell">


    <main class="main">


      <section class="page">
        <div class="content-grid">
          <section class="workspace">
            <div class="page-heading">
              <div><h1>我的班级</h1><p>正在加载本人授权班级…</p></div>
              <div class="heading-actions">
                <button class="primary-action" data-action="create"><span>＋</span>创建班级</button>
                <button class="secondary-action" data-action="import"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5-5 5 5M5 21h14"/></svg>导入学生</button>
                <div class="view-switch">
                  <button class="active" data-view="map"><svg viewBox="0 0 24 24"><path d="M5 4h4v4H5zM10 4h4v4h-4zM15 4h4v4h-4zM5 9h4v4H5zM10 9h4v4h-4zM15 9h4v4h-4zM5 14h4v4H5zM10 14h4v4h-4zM15 14h4v4h-4z"/></svg>地图视图</button>
                  <button data-view="list" aria-label="列表视图"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
                </div>
              </div>
            </div>

            <section class="guide-banner">
              <div><span class="guide-icon"><svg viewBox="0 0 24 24"><path d="M8 9a3 3 0 1 1 0-6 3 3 0 0 1 0 6ZM16 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6ZM7 21v-3a4 4 0 0 1 4-4h2a4 4 0 0 1 4 4v3"/></svg></span><span><strong>班级学习路径</strong><small>沿着学习路径推进教学：课程 → 任务 → 测评 → 复盘，循序渐进，见证成长。</small></span></div>
              <button data-action="guide">查看指南</button>
            </section>

            <section class="class-map" id="mapView">
              <img class="map-background" src="./assets/class-valley-background.webp" alt="" />
              <div class="map-toolbar">
                <div class="legend">
                  <span><i class="legend-icon red-book"></i>课程</span>
                  <span><i class="legend-icon orange-task"></i>任务</span>
                  <span><i class="legend-icon green-eval"></i>测评</span>
                  <span><i class="legend-icon blue-review"></i>复盘</span>
                </div>
                <select id="gradeFilter" aria-label="年级筛选">
                  <option value="all">全部年级</option>
                  <option value="高一">高一年级</option>
                  <option value="高二">高二年级</option>
                  <option value="初二">初二年级</option>
                  <option value="初一">初一年级</option>
                  <option value="高三">高三年级</option>
                </select>
              </div>

              <svg class="learning-route" viewBox="0 0 1050 660" preserveAspectRatio="none" aria-hidden="true">
                <path d="M104 190 C250 145 420 165 475 245 C520 315 340 340 385 405 C425 470 580 405 630 505 C675 590 625 618 712 647"/>
                <circle cx="104" cy="190" r="12"/><circle cx="475" cy="245" r="11"/><circle cx="385" cy="405" r="10"/><circle cx="630" cy="505" r="10"/><circle cx="712" cy="647" r="8"/>
              </svg>

              <div class="class-empty-state class-loading">正在加载本人授权班级…</div>

            </section>

            <section class="list-view" id="listView" hidden>
              <table>
                <thead><tr><th>班级名称</th><th>年级</th><th>在读学生</th><th>操作</th></tr></thead>
                <tbody></tbody>
              </table>
            </section>
          </section>

          <aside class="right-rail">
            <section class="side-card unavailable-card">
              <header><h2>日历与待处理事项</h2></header>
              <p>此处暂未接入真实日程和待办数据，相关数字不会显示为教学事实。</p>
            </section>

            <section class="side-card quick-card">
              <header><h2>快捷操作</h2></header>
              <div class="quick-grid">
                <button data-action="task"><span><svg viewBox="0 0 24 24"><path d="m5 19 4-1 9-9-3-3-9 9zM14 7l3 3"/></svg></span>发布任务</button>
                <button data-action="assessment"><span><svg viewBox="0 0 24 24"><path d="M7 3h10v18H7zM10 7h4M10 11h4M10 15h3"/></svg></span>发布测评</button>
                <button data-action="analytics"><span><svg viewBox="0 0 24 24"><path d="M5 19V9M12 19V5M19 19v-7"/></svg></span>学情分析</button>
                <button data-action="resource"><span><svg viewBox="0 0 24 24"><path d="M4 7h7l2 2h7v10H4zM8 4h8v3H8"/></svg></span>资源中心</button>
              </div>
            </section>
          </aside>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="关闭">×</button>
      <div class="modal-mark" id="modalMark">✓</div>
      <h2 id="modalTitle">操作说明</h2>
      <p id="modalText"></p>
      <div class="modal-actions">
        <button class="modal-secondary" id="modalCancel">取消</button>
        <button class="modal-primary" id="modalConfirm">确认</button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/assets/api-client.js"></script>
  <script src="./app.js"></script>
  <script src="/shared/teacher-shell.js" defer></script>

</html>
