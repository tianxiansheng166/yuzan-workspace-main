name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NUXT_TELEMETRY_DISABLED: "1"

# GOV-002 baseline note:
# Root-level checks (contract validation, database validation, recursive
# lint/typecheck/test/build) are temporarily allowed to fail until GOV-002
# "root-level baseline" is finalized and merged. The required web-layer
# checks below already gate the main branch.
jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  format:
    name: Format check
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check whitespace
        run: git diff --check

  web:
    name: Web layer checks
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt
        run: pnpm --filter @yuzan/web exec nuxt prepare

      - name: Web tests
        run: pnpm --filter @yuzan/web test

      - name: Web typecheck
        run: pnpm --filter @yuzan/web typecheck

      - name: Web build
        run: pnpm --filter @yuzan/web build

  root-baseline:
    name: Root-level baseline (experimental)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GOV-002: allow this job to fail until the root-level baseline merges.
    continue-on-error: true
    env:
      # Dummy values only. No real secrets or external services are used.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      SESSION_SECRET: ci-session-secret-must-be-longer-than-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate contracts
        run: pnpm contract:validate

      - name: Validate database schema
        run: pnpm db:validate

      - name: Lint all packages
        run: pnpm lint

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Test all packages
        run: pnpm test

      - name: Build all packages
        run: pnpm build
