# Example Prometheus alerting rules for the API service.
# All thresholds, durations, and routing are examples; tune before production.
groups:
  - name: yuzan-api-alerts
    rules:
      - alert: YuzanApiNotReady
        expr: sum(dependency_status{status!~"healthy|degraded"}) by (job, name) > 0
        for: 1m
        labels:
          severity: P1
        annotations:
          summary: "API cannot receive traffic: {{ $labels.name }} is unavailable"
          runbook_url: "https://wiki.example/runbooks/yuzan-api-not-ready"
          impact: "API readiness probe fails; load balancers stop routing traffic."
          recovery: "Resolve when dependency_status returns healthy for 2 minutes."

      - alert: YuzanApiHighErrorRate
        expr: |
          sum(rate(http_errors_total[5m])) by (service)
          /
          sum(rate(http_requests_total[5m])) by (service)
          > 0.05
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "API error rate above 5% for 5 minutes"
          impact: "Users see service failures."
          recovery: "Error rate below 2% for 5 minutes."
          min_request_rate: "10 requests per minute"

      - alert: YuzanApiHighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_ms_bucket[5m])) by (le, route)) > 1000
        for: 5m
        labels:
          severity: P2
        annotations:
          summary: "API p95 latency above 1s for 5 minutes"
          impact: "User experience degraded."
          recovery: "p95 latency below 800ms for 5 minutes."

      - alert: YuzanApiDependencyUnavailable
        expr: sum(dependency_status{status="unavailable"}) by (name) > 0
        for: 2m
        labels:
          severity: P2
        annotations:
          summary: "Dependency {{ $labels.name }} is unavailable"
          runbook_url: "https://wiki.example/runbooks/yuzan-dependency"
          recovery: "Dependency health check returns healthy for 2 minutes."

      - alert: YuzanApiSyncFailures
        expr: sum(increase(sync_failures_total[1h])) by (reason) > 100
        for: 5m
        labels:
          severity: P2
        annotations:
          summary: "Sync failures spiking"
          recovery: "Sync failure rate returns to baseline for 15 minutes."

      - alert: YuzanApiQueueBacklog
        expr: background_jobs_total{state="queued"} > 1000
        for: 10m
        labels:
          severity: P3
        annotations:
          summary: "Background job queue backlog above 1000"
          recovery: "Queue length below 200 for 10 minutes."

      - alert: YuzanApiRedactionViolation
        expr: increase(log_redaction_violations_total[1h]) > 0
        for: 0m
        labels:
          severity: P1
        annotations:
          summary: "Potential PII logged without redaction"
          impact: "Security incident; may contain student data."
          recovery: "Investigate flagged log lines and rotate affected tokens."
