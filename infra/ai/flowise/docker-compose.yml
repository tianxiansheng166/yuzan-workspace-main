# Flowise — Local AI Workflow Orchestration
# Pinned version: 3.1.1 (Apache-2.0 Community Edition)
#
# Version choice: 3.1.1 over 3.0.12
#   - 3.0.12 (Jan 2026) is outdated; missing Agentflow V2 stability fixes
#   - 3.1.1 (Mar 2026) is validated in deployment guides and includes
#     security fixes for internal HTTP access and Agentflow V2 improvements
#   - 3.1.2 (May 2026) is the latest image but has less community validation
#   - We pin 3.1.1 for stability; upgrade to 3.1.2 after validation
# DO NOT use :latest — always pin to a specific version.
#
# Usage:
#   cp .env.example .env   # then edit .env with real values
#   docker compose up -d
#
# Flowise UI:  http://127.0.0.1:4300
# Health:      http://127.0.0.1:4300/api/v1/ping
#
# Production notes (DO NOT implement in P0):
#   - Use independent PostgreSQL instead of SQLite
#   - Use independent secret management (Vault / K8s Secrets)
#   - Do NOT use SQLite in production
#   - Add TLS termination
#   - Restrict network at infrastructure level

services:
  flowise:
    image: flowiseai/flowise:3.1.1
    container_name: yuzan-flowise
    restart: unless-stopped
    ports:
      - "127.0.0.1:4300:4300"
    environment:
      - PORT=4300
      - DATABASE_TYPE=sqlite
      - DATABASE_PATH=/opt/flowise/data/database.sqlite
      - SECRETKEY_PATH=/opt/flowise/secret
      - FLOWISE_USERNAME=${FLOWISE_USERNAME:-yuzan_dev}
      - FLOWISE_PASSWORD=${FLOWISE_PASSWORD:-YuzanDev2024!}
      - PASSPHRASE=${PASSPHRASE:-yuzan-flowise-secret}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://127.0.0.1:4175,http://localhost:4175}
      - IFRAME_ORIGINS=${IFRAME_ORIGINS:-}
      - DISABLE_COMMUNITY_NODES=true
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - NODE_OPTIONS=--max-old-space-size=4096
    volumes:
      - ../../../runtime-local/flowise/data:/opt/flowise/data
      - ../../../runtime-local/flowise/logs:/opt/flowise/logs
      - ../../../runtime-local/flowise/storage:/opt/flowise/storage
      - ../../../runtime-local/flowise/secret:/opt/flowise/secret
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4300/api/v1/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    entrypoint: /bin/sh -c "sleep 3; flowise start"
    deploy:
      resources:
        limits:
          memory: 4G
