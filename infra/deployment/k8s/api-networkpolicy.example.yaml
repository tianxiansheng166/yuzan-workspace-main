# Example network policy allowing egress only to required dependencies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yuzan-api
spec:
  podSelector:
    matchLabels:
      app: yuzan-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 4000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 9000
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
