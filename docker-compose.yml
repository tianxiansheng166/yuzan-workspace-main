name: ${COMPOSE_PROJECT_NAME:-p0-integration}

services:
  postgres:
    image: postgres:17-alpine
    profiles: ["bootstrap-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yuzan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yuzan_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-yuzan_dev}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - yuzan-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-yuzan} -d ${POSTGRES_DB:-yuzan_dev}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-dev-only-secret}
    ports:
      - "${MINIO_API_PORT:-59000}:9000"
      - "${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - yuzan-minio:/data

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  yuzan-postgres:
    name: ${POSTGRES_VOLUME_NAME:-yuzan-four-port-postgres-55432}
  yuzan-minio:
