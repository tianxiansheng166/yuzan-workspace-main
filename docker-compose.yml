services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yuzan
      POSTGRES_PASSWORD: yuzan_dev_only
      POSTGRES_DB: yuzan
    ports:
      - "5432:5432"
    volumes:
      - yuzan-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuzan -d yuzan"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: replace-dev-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - yuzan-minio:/data

volumes:
  yuzan-postgres:
  yuzan-minio:
