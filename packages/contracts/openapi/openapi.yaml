openapi: 3.1.0
info:
  title: 语赞心声 API
  version: 0.1.0
  description: Contract baseline for the first real teaching loop.
  license:
    name: Proprietary
servers:
  - url: /api/v1
    description: Current deployment origin
tags:
  - name: Health
    description: 服务健康检查与依赖就绪状态
  - name: Auth
    description: 身份认证、会话刷新与当前身份信息
  - name: Curriculum
    description: 课程版本、草稿与教研发布流程
  - name: Classes
    description: 学校班级与学期管理
  - name: Assignments
    description: 任务布置、开放与状态转换
  - name: Learning
    description: 学生今日任务与活动进度
  - name: Submissions
    description: 学生任务提交与尝试
  - name: Feedback
    description: 教师反馈、复核与退回
  - name: Sync
    description: 离线同步操作推送与增量拉取
paths:
  /health/live:
    get:
      summary: 存活探针
      tags: [Health]
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                data:
                  status: ok
                  timestamp: "2026-07-09T09:00:00Z"
                meta:
                  requestId: "00000000-0000-0000-0000-000000000001"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /health/ready:
    get:
      summary: 就绪探针
      tags: [Health]
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Required dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/login:
    post:
      summary: 用户登录
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              identifier: "teacher@example.edu"
              password: "secure-placeholder"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/refresh:
    post:
      summary: 刷新会话
      tags: [Auth]
      operationId: refreshSession
      security: []
      responses:
        "200":
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      summary: 退出登录
      tags: [Auth]
      operationId: logout
      responses:
        "204":
          description: Session revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/select-school:
    post:
      summary: Select an authorized school and rotate the active session
      tags: [Auth]
      operationId: selectSchool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectSchoolRequest"
      responses:
        "200":
          description: Active school selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /me:
    get:
      summary: 获取当前用户
      tags: [Auth]
      operationId: getCurrentUser
      responses:
        "200":
          description: Current identity and memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /schools/{schoolId}/course-versions:
    get:
      summary: 列出课程版本
      tags: [Curriculum]
      operationId: listCourseVersions
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/CourseVersionStatus"
      responses:
        "200":
          description: Course versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseVersionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: 创建课程草稿
      tags: [Curriculum]
      operationId: createCourseDraft
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseDraftRequest"
            example:
              title: "一年级语音入门"
              description: "语音意识基础课程"
              gradeBand: "一年级"
              locale: "zh-CN"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseVersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /schools/{schoolId}/course-versions/{courseVersionId}:publish:
    post:
      summary: 发布课程版本
      tags: [Curriculum]
      operationId: publishCourseVersion
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/CourseVersionId"
      responses:
        "200":
          description: Published immutable version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseVersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /schools/{schoolId}/course-versions/{courseVersionId}:
    get:
      summary: Read a school-scoped course version
      tags: [Curriculum]
      operationId: getCourseVersion
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/CourseVersionId"
      responses:
        "200":
          description: Course version detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseVersionDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Atomically update an editable course draft
      tags: [Curriculum]
      operationId: updateCourseDraft
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/CourseVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseDraftRequest"
      responses:
        "200":
          description: Updated course draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseVersionDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /schools/{schoolId}/classes:
    get:
      summary: 列出班级
      tags: [Classes]
      operationId: listClasses
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Classes in active school scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /schools/{schoolId}/assignments:
    post:
      summary: 布置任务
      tags: [Assignments]
      operationId: createAssignment
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentRequest"
            example:
              courseVersionId: "22222222-2222-2222-2222-222222222222"
              title: "第一周语音练习"
              startsAt: "2026-07-10T00:00:00Z"
              dueAt: "2026-07-17T23:59:59Z"
              offlineRequired: true
              targets:
                - targetType: CLASS
                  classId: "11111111-1111-1111-1111-111111111111"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /schools/{schoolId}/assignments/{assignmentId}:open:
    post:
      summary: 开放任务
      tags: [Assignments]
      operationId: openAssignment
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "200":
          description: Assignment opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /schools/{schoolId}/students/me/today:
    get:
      summary: 获取学生今日任务
      tags: [Learning]
      operationId: getMyTodayTasks
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: Student today tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayTasksResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /schools/{schoolId}/activities/{activityId}/progress:
    put:
      summary: 保存活动进度
      tags: [Learning]
      operationId: saveActivityProgress
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProgressRequest"
            example:
              position: 12
              completed: false
              clientUpdatedAt: "2026-07-09T08:30:00Z"
      responses:
        "200":
          description: Progress saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /schools/{schoolId}/assignments/{assignmentId}/submissions:
    post:
      summary: 提交任务答案
      tags: [Submissions]
      operationId: submitAssignment
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/AssignmentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAssignmentRequest"
            example:
              deviceId: "33333333-3333-3333-3333-333333333333"
              attempts:
                - activityId: "44444444-4444-4444-4444-444444444444"
                  kind: "TEXT"
                  text: "示范回答"
      responses:
        "201":
          description: Submission accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /schools/{schoolId}/submissions/{submissionId}/feedback:
    post:
      summary: 发布教师反馈
      tags: [Feedback]
      operationId: releaseFeedback
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/SubmissionId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseFeedbackRequest"
            example:
              decision: "ACCEPT"
              comment: "发音清晰，继续加油"
              score: 85
      responses:
        "200":
          description: Feedback released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /schools/{schoolId}/sync/push:
    post:
      summary: 推送离线同步操作
      tags: [Sync]
      operationId: pushSyncOperations
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushRequest"
            example:
              deviceId: "55555555-5555-5555-5555-555555555555"
              clientOperationId: "66666666-6666-6666-6666-666666666666"
              operations:
                - operationId: "77777777-7777-7777-7777-777777777777"
                  entityType: "progress"
                  entityId: "88888888-8888-8888-8888-888888888888"
                  action: "upsert"
                  baseRevision: 3
                  payload:
                    position: 12
                    completed: false
                  createdAt: "2026-07-09T08:30:00Z"
      responses:
        "200":
          description: Per-operation receipts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPushResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /schools/{schoolId}/sync/pull:
    get:
      summary: 拉取增量变更
      tags: [Sync]
      operationId: pullSyncChanges
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - in: query
          name: cursor
          description: 不透明游标，客户端不得解析其内部结构
          schema:
            type: string
      responses:
        "200":
          description: Changes since cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPullResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SchoolId:
      in: path
      name: schoolId
      required: true
      description: 学校（租户）标识
      schema:
        type: string
        format: uuid
        example: "00000000-0000-0000-0000-000000000000"
    Limit:
      in: query
      name: limit
      description: 分页返回数量上限
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      in: query
      name: cursor
      description: 游标， opaque 字符串
      schema:
        type: string
    CourseVersionId:
      in: path
      name: courseVersionId
      required: true
      description: 课程版本 ID
      schema:
        type: string
        format: uuid
    AssignmentId:
      in: path
      name: assignmentId
      required: true
      description: 任务 ID
      schema:
        type: string
        format: uuid
    ActivityId:
      in: path
      name: activityId
      required: true
      description: 学习活动 ID
      schema:
        type: string
        format: uuid
    SubmissionId:
      in: path
      name: submissionId
      required: true
      description: 提交 ID
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: 幂等键，与认证主体、路由和请求摘要绑定；重复请求返回首次业务结果，具体保留期限由服务端策略决定
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      in: header
      name: If-Match
      required: true
      description: 客户端持有的资源 revision（整数字符串形式），与服务端当前 revision 不一致时返回 409
      schema:
        type: string
  responses:
    BadRequest:
      description: 请求参数无效或格式错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INVALID_REQUEST
              message: 请求参数无效
              details: {}
              requestId: "00000000-0000-0000-0000-000000000002"
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but outside allowed resource scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource does not exist, has been soft-deleted, or is not visible in the current school scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: State or revision conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Required dependency unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: 服务端内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    EnvelopeMeta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
        nextCursor:
          type: [string, "null"]
        hasMore:
          type: boolean
      example:
        requestId: "00000000-0000-0000-0000-000000000001"
        nextCursor: null
        hasMore: false
    ErrorBody:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
          minLength: 1
        message:
          type: string
        details:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: "null"
              - type: array
                items:
                  type: string
        requestId:
          type: string
          format: uuid
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      example:
        error:
          code: ASSIGNMENT_NOT_OPEN
          message: 当前任务尚未开放
          details:
            assignmentId: "11111111-1111-1111-1111-111111111111"
          requestId: "00000000-0000-0000-0000-000000000003"
    Health:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        timestamp:
          type: string
          format: date-time
    HealthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Health"
        meta:
          $ref: "#/components/schemas/EnvelopeMeta"
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
    Membership:
      type: object
      required: [schoolId, schoolName, role]
      properties:
        schoolId:
          type: string
          format: uuid
        schoolName:
          type: string
        role:
          type: string
          enum: [STUDENT, TEACHER, RESEARCHER, SCHOOL_ADMIN, PLATFORM_ADMIN]
    CurrentUser:
      type: object
      required: [id, displayName, memberships]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        preferredLocale:
          type: string
          default: zh-CN
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        activeSchoolId:
          type: string
          format: uuid
    AuthSession:
      type: object
      required: [accessToken, activeSchoolId, expiresIn, user]
      properties:
        accessToken:
          type: string
        activeSchoolId:
          type: [string, "null"]
          format: uuid
        expiresIn:
          type: integer
        user:
          $ref: "#/components/schemas/CurrentUser"
    AuthSessionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AuthSession"
        meta:
          $ref: "#/components/schemas/EnvelopeMeta"
    CurrentUserResponse:
      type: object
      required: [data, meta]
      properties:
        data:
