openapi: 3.1.0
info:
  title: 语赞心声 API
  version: 0.1.0
  description: Contract baseline for the first real teaching loop.
  license:
    name: Proprietary
    url: https://example.edu/license
servers:
  - url: /api/v1
    description: Current deployment origin
tags:
  - name: Health
    description: 服务健康检查与依赖就绪状态
  - name: Auth
    description: 身份认证、会话刷新与当前身份信息
  - name: Curriculum
    description: 课程版本、草稿与教研发布流程
  - name: Classes
    description: 学校班级与学期管理
  - name: Assignments
    description: 任务布置、开放与状态转换
  - name: Learning
    description: 学生今日任务与活动进度
  - name: Submissions
    description: 学生任务提交与尝试
  - name: Feedback
    description: 教师反馈、复核与退回
  - name: Sync
    description: 离线同步操作推送与增量拉取
  - name: Reporting
    description: 学生成长档案、班级与学校级报表
  - name: Offline
    description: 离线内容包管理与同步批次
  - name: Operations
    description: 运维健康检查与系统状态
  - name: Assessments
    description: 朗读与理解测评会话、作答、报告与复核（黄金闭环）
  - name: Recordings
    description: 录音初始化、分片上传、完成与证据查询
  - name: SpeechJobs
    description: 语音评分任务创建、查询与 worker 回写
  - name: TeacherInvitations
    description: 教师班级邀请码创建与学生绑定
paths:
  /health/live:
    get:
      summary: 存活探针
      tags: [Health]
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                data:
                  status: ok
                  timestamp: "2026-07-09T09:00:00Z"
                meta:
                  requestId: "00000000-0000-0000-0000-000000000001"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /health/ready:
    get:
      summary: 就绪探针
      tags: [Health]
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Required dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/login:
    post:
      summary: 用户登录
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              identifier: "teacher@example.edu"
              password: "secure-placeholder"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/refresh:
    post:
      summary: 刷新会话
      tags: [Auth]
      operationId: refreshSession
      security: []
      responses:
        "200":
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      summary: 退出登录
      tags: [Auth]
      operationId: logout
      responses:
        "204":
          description: Session revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/select-school:
    post:
      summary: Select an authorized school and rotate the active session
      tags: [Auth]
      operationId: selectSchool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectSchoolRequest"
      responses:
        "200":
          description: Active school selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /me:
    get:
      summary: 获取当前用户
      tags: [Auth]
      operationId: getCurrentUser
      responses:
        "200":
          description: Current identity and memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /schools/{schoolId}/course-versions:
    get:
      summary: 列出课程版本
      tags: [Curriculum]
      operationId: listCourseVersions
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/CourseVersionStatus"
      responses:
        "200":
          description: Course versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseVersionListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: 创建课程草稿
      tags: [Curriculum]
      operationId: createCourseDraft
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseDraftRequest"
            example:
              title: "一年级语音入门"
              description: "语音意识基础课程"
              gradeBand: "一年级"
              locale: "zh-CN"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseVersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /schools/{schoolId}/course-versions/{courseVersionId}/publish:
    post:
      summary: 发布课程版本
      tags: [Curriculum]
      operationId: publishCourseVersion
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/CourseVersionId"
      responses:
        "200":
          description: Published immutable version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseVersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /schools/{schoolId}/course-versions/{courseVersionId}:
    get:
      summary: Read a school-scoped course version
      tags: [Curriculum]
      operationId: getCourseVersion
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/CourseVersionId"
      responses:
        "200":
          description: Course version detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseVersionDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Atomically update an editable course draft
      tags: [Curriculum]
      operationId: updateCourseDraft
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/CourseVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseDraftRequest"
      responses:
        "200":
          description: Updated course draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseVersionDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /schools/{schoolId}/classes:
    get:
      summary: 列出班级
      tags: [Classes]
      operationId: listClasses
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Classes in active school scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /schools/{schoolId}/assignments:
    post:
      summary: 布置任务
      tags: [Assignments]
      operationId: createAssignment
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentRequest"
            example:
              courseVersionId: "22222222-2222-2222-2222-222222222222"
              title: "第一周语音练习"
              startsAt: "2026-07-10T00:00:00Z"
              dueAt: "2026-07-17T23:59:59Z"
              offlineRequired: true
              targets:
                - targetType: CLASS
                  classId: "11111111-1111-1111-1111-111111111111"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /schools/{schoolId}/assignments/{assignmentId}:open:
    post:
      summary: 开放任务
      tags: [Assignments]
      operationId: openAssignment
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "200":
          description: Assignment opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /schools/{schoolId}/students/me/today:
    get:
      summary: 获取学生今日任务
      tags: [Learning]
      operationId: getMyTodayTasks
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: Student today tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayTasksResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /schools/{schoolId}/activities/{activityId}/progress:
    put:
      summary: 保存活动进度
      tags: [Learning]
      operationId: saveActivityProgress
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProgressRequest"
            example:
              position: 12
              completed: false
              clientUpdatedAt: "2026-07-09T08:30:00Z"
      responses:
        "200":
          description: Progress saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /schools/{schoolId}/assignments/{assignmentId}/submissions:
    post:
      summary: 提交任务答案
      tags: [Submissions]
      operationId: submitAssignment
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/AssignmentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAssignmentRequest"
            example:
              deviceId: "33333333-3333-3333-3333-333333333333"
              attempts:
                - activityId: "44444444-4444-4444-4444-444444444444"
                  kind: "TEXT"
                  text: "示范回答"
      responses:
        "201":
          description: Submission accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /schools/{schoolId}/submissions/{submissionId}/feedback:
    post:
      summary: 发布教师反馈
      tags: [Feedback]
      operationId: releaseFeedback
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/SubmissionId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseFeedbackRequest"
            example:
              decision: "ACCEPT"
              comment: "发音清晰，继续加油"
              score: 85
      responses:
        "200":
          description: Feedback released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /schools/{schoolId}/sync/push:
    post:
      summary: 推送离线同步操作
      tags: [Sync]
      operationId: pushSyncOperations
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushRequest"
            example:
              deviceId: "55555555-5555-5555-5555-555555555555"
              clientOperationId: "66666666-6666-6666-6666-666666666666"
              operations:
                - operationId: "77777777-7777-7777-7777-777777777777"
                  entityType: "progress"
                  entityId: "88888888-8888-8888-8888-888888888888"
                  action: "upsert"
                  baseRevision: 3
                  payload:
                    position: 12
                    completed: false
                  createdAt: "2026-07-09T08:30:00Z"
      responses:
        "200":
          description: Per-operation receipts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPushResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /schools/{schoolId}/sync/pull:
    get:
      summary: 拉取增量变更
      tags: [Sync]
      operationId: pullSyncChanges
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - in: query
          name: cursor
          description: 不透明游标，客户端不得解析其内部结构
          schema:
            type: string
      responses:
        "200":
          description: Changes since cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPullResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /schools/{schoolId}/reports:
    get:
      summary: 列出报表
      tags: [Reporting]
      operationId: listReports
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - in: query
          name: type
          schema:
            $ref: "#/components/schemas/ReportType"
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/ReportStatus"
      responses:
        "200":
          description: Reports list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: 请求生成报表
      tags: [Reporting]
      operationId: createReport
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "201":
          description: Report generation requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /schools/{schoolId}/reports/{reportId}:
    get:
      summary: 获取报表详情
      tags: [Reporting]
      operationId: getReport
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Report detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /schools/{schoolId}/student-growth/{enrollmentId}:
    get:
      summary: 获取学生成长档案
      tags: [Reporting]
      operationId: getStudentGrowthProfile
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/EnrollmentId"
      responses:
        "200":
          description: Student growth profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentGrowthProfileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /schools/{schoolId}/offline-packages:
    get:
      summary: 列出离线内容包
      tags: [Offline]
      operationId: listOfflinePackages
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - in: query
          name: courseVersionId
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Offline content packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflinePackageListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      summary: 请求构建离线内容包
      tags: [Offline]
      operationId: createOfflinePackage
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOfflinePackageRequest"
      responses:
        "201":
          description: Offline package build requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflinePackageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /schools/{schoolId}/offline-packages/{packageId}:
    get:
      summary: 获取离线内容包详情
      tags: [Offline]
      operationId: getOfflinePackage
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/PackageId"
      responses:
        "200":
          description: Offline package detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflinePackageDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /schools/{schoolId}/offline-packages/{packageId}:download:
    post:
      summary: 授权下载离线内容包
      tags: [Offline]
      operationId: authorizeOfflineDownload
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/PackageId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Download authorized
          content:
            application/json:
              schema:
