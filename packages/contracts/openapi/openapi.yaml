openapi: 3.1.0
info:
  title: 语赞心声 API
  version: 0.1.0
  description: Contract baseline for the first real teaching loop.
servers:
  - url: http://localhost:4000/api/v1
tags:
  - name: Health
  - name: Auth
  - name: Curriculum
  - name: Classes
  - name: Assignments
  - name: Learning
  - name: Submissions
  - name: Feedback
  - name: Sync
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Required dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security: []
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      responses:
        '200':
          description: Current identity and memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /course-versions:
    get:
      tags: [Curriculum]
      operationId: listCourseVersions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/CourseVersionStatus'
      responses:
        '200':
          description: Course versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseVersionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Curriculum]
      operationId: createCourseDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseDraftRequest'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseVersionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /course-versions/{courseVersionId}:publish:
    post:
      tags: [Curriculum]
      operationId: publishCourseVersion
      parameters:
        - $ref: '#/components/parameters/CourseVersionId'
      responses:
        '200':
          description: Published immutable version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseVersionResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /classes:
    get:
      tags: [Classes]
      operationId: listClasses
      responses:
        '200':
          description: Classes in active school scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassListResponse'
  /assignments:
    post:
      tags: [Assignments]
      operationId: createAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /assignments/{assignmentId}:open:
    post:
      tags: [Assignments]
      operationId: openAssignment
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: Assignment opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /students/me/today:
    get:
      tags: [Learning]
      operationId: getMyTodayTasks
      responses:
        '200':
          description: Student today tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayTasksResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /activities/{activityId}/progress:
    put:
      tags: [Learning]
      operationId: saveActivityProgress
      parameters:
        - $ref: '#/components/parameters/ActivityId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveProgressRequest'
      responses:
        '200':
          description: Progress saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /assignments/{assignmentId}/submissions:
    post:
      tags: [Submissions]
      operationId: submitAssignment
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAssignmentRequest'
      responses:
        '201':
          description: Submission accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /submissions/{submissionId}/feedback:
    post:
      tags: [Feedback]
      operationId: releaseFeedback
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseFeedbackRequest'
      responses:
        '200':
          description: Feedback released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /sync/push:
    post:
      tags: [Sync]
      operationId: pushSyncOperations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: Per-operation receipts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
  /sync/pull:
    get:
      tags: [Sync]
      operationId: pullSyncChanges
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        '200':
          description: Changes since cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
    CourseVersionId:
      in: path
      name: courseVersionId
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      in: path
      name: assignmentId
      required: true
      schema:
        type: string
        format: uuid
    ActivityId:
      in: path
      name: activityId
      required: true
      schema:
        type: string
        format: uuid
    SubmissionId:
      in: path
      name: submissionId
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but outside allowed resource scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State or revision conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Required dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    EnvelopeMeta:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    ErrorBody:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
        requestId: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
    Health:
      type: object
      required: [status, timestamp]
      properties:
        status: { type: string, enum: [ok, degraded] }
        timestamp: { type: string, format: date-time }
    HealthResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Health' }
        meta: { $ref: '#/components/schemas/EnvelopeMeta' }
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, minLength: 1, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
    Membership:
      type: object
      required: [schoolId, schoolName, role]
      properties:
        schoolId: { type: string, format: uuid }
        schoolName: { type: string }
        role: { type: string, enum: [STUDENT, TEACHER, RESEARCHER, SCHOOL_ADMIN, PLATFORM_ADMIN] }
    CurrentUser:
      type: object
      required: [id, displayName, memberships]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        preferredLocale: { type: string, default: zh-CN }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/Membership' }
    AuthSession:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer }
        user: { $ref: '#/components/schemas/CurrentUser' }
    AuthSessionResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/AuthSession' }
        meta: { $ref: '#/components/schemas/EnvelopeMeta' }
    CurrentUserResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/CurrentUser' }
        meta: { $ref: '#/components/schemas/EnvelopeMeta' }
    CourseVersionStatus:
      type: string
      enum: [DRAFT, IN_REVIEW, CHANGES_REQUESTED, APPROVED, PUBLISHED, RETIRED]
    CourseVersionSummary:
      type: object
      required: [id, courseId, version, title, status, updatedAt]
      properties:
        id: { type: string, format: uuid }
        courseId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        title: { type: string }
        status: { $ref: '#/components/schemas/CourseVersionStatus' }
        gradeBand: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
    CourseVersionListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CourseVersionSummary' }
        meta: { $ref: '#/components/schemas/EnvelopeMeta' }
    CreateCourseDraftRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        gradeBand: { type: string }
        locale: { type: string, default: zh-CN }
    CourseVersionResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/CourseVersionSummary' }
        meta: { $ref: '#/components/schemas/EnvelopeMeta' }
    ClassSummary:
      type: object
      required: [id, name, grade, studentCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        grade: { type: string }
        studentCount: { type: integer, minimum: 0 }
    ClassListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ClassSummary' }
        meta: { $ref: '#/components/schemas/EnvelopeMeta' }
    AssignmentStatus:
      type: string
      enum: [DRAFT, SCHEDULED, OPEN, CLOSED, CANCELLED, ARCHIVED]
    CreateAssignmentRequest:
      type: object
      required: [classId, courseVersionId, title, startsAt, dueAt]
      properties:
        classId: { type: string, format: uuid }
        courseVersionId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 160 }
        startsAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        offlineRequired: { type: boolean, default: false }
    Assignment:
      type: object
      required: [id, classId, courseVersionId, title, status, startsAt, dueAt, revision]
      properties:
        id: { type: string, format: uuid }
        classId: { type: string, format: uuid }
        courseVersionId: { type: string, format: uuid }
        title: { type: string }
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        startsAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        revision: { type: integer, minimum: 1 }
        offlineRequired: { type: boolean }
    AssignmentResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Assignment' }
        meta: { $ref: '#/components/schemas/EnvelopeMeta' }
    TodayTask:
      allOf:
        - $ref: '#/components/schemas/Assignment'
        - type: object
          required: [progressStatus, downloadStatus]
          properties:
            progressStatus: { type: string, enum: [NOT_STARTED, IN_PROGRESS, PENDING_SYNC, SUBMITTED, REVIEWED] }
            downloadStatus: { type: string, enum: [NOT_REQUIRED, NOT_DOWNLOADED, DOWNLOADING, READY, FAILED] }
    TodayTasksResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TodayTask' }
        meta: { $ref: '#/components/schemas/EnvelopeMeta' }
    SaveProgressRequest:
      type: object
      required: [position, completed]
      properties:
        position: { type: number, minimum: 0 }
        completed: { type: boolean }
        clientUpdatedAt: { type: string, format: date-time }
    Progress:
      type: object
      required: [activityId, position, completed, revision, updatedAt]
      properties:
        activityId: { type: string, format: uuid }
        position: { type: number }
        completed: { type: boolean }
        revision: { type: integer }
        updatedAt: { type: string, format: date-time }
    ProgressResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Progress' }
        meta: { $ref: '#/components/schemas/EnvelopeMeta' }
    AnswerInput:
      type: object
      required: [activityId, kind]
      properties:
        activityId: { type: string, format: uuid }
        kind: { type: string, enum: [CHOICE, TEXT, SPEECH] }
        value: {}
        audioAssetId: { type: [string, 'null'], format: uuid }
    SubmitAssignmentRequest:
      type: object
      required: [attemptNo, answers]
      properties:
        attemptNo: { type: integer, minimum: 1 }
        deviceId: { type: [string, 'null'], format: uuid }
        answers:
          type: array
          items: { $ref: '#/components/schemas/AnswerInput' }
    Submission:
      type: object
      required: [id, assignmentId, status, attemptNo, revision, submittedAt]
      properties:
        id: { type: string, format: uuid }
        assignmentId: { type: string, format: uuid }
        status: { type: string, enum: [SUBMITTED, PROCESSING, NEEDS_REVIEW, REVIEWED, RETURNED, ACCEPTED] }
        attemptNo: { type: integer }
        revision: { type: integer }
        submittedAt: { type: string, format: date-time }
    SubmissionResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Submission' }
        meta: { $ref: '#/components/schemas/EnvelopeMeta' }
    ReleaseFeedbackRequest:
      type: object
      required: [decision, comment]
      properties:
        decision: { type: string, enum: [ACCEPT, RETURN] }
        comment: { type: string, minLength: 1, maxLength: 4000 }
        score: { type: [number, 'null'], minimum: 0, maximum: 100 }
    Feedback:
      type: object
      required: [id, submissionId, decision, comment, releasedAt, revision]
      properties:
        id: { type: string, format: uuid }
        submissionId: { type: string, format: uuid }
        decision: { type: string, enum: [ACCEPT, RETURN] }
        comment: { type: string }
        score: { type: [number, 'null'] }
        releasedAt: { type: string, format: date-time }
        revision: { type: integer }
    FeedbackResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Feedback' }
        meta: { $ref: '#/components/schemas/EnvelopeMeta' }
    SyncOperation:
      type: object
      required: [operationId, entityType, entityId, action, payload, createdAt]
      properties:
        operationId: { type: string, format: uuid }
        entityType: { type: string }
        entityId: { type: string }
        action: { type: string }
        baseRevision: { type: [integer, 'null'] }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    SyncPushRequest:
      type: object
      required: [deviceId, operations]
      properties:
        deviceId: { type: string, format: uuid }
        operations:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/SyncOperation' }
    SyncReceipt:
      type: object
      required: [operationId, status]
      properties:
        operationId: { type: string, format: uuid }
        status: { type: string, enum: [ACKNOWLEDGED, CONFLICT, PERMANENT_FAILURE] }
        serverRevision: { type: [integer, 'null'] }
        errorCode: { type: [string, 'null'] }
    SyncPushResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SyncReceipt' }
        meta: { $ref: '#/components/schemas/EnvelopeMeta' }
    SyncChange:
      type: object
      required: [changeId, entityType, entityId, revision, changedAt, payload]
      properties:
        changeId: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        revision: { type: integer }
        changedAt: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    SyncPullResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SyncChange' }
        meta: { $ref: '#/components/schemas/EnvelopeMeta' }
security:
  - bearerAuth: []
