          $ref: "#/components/responses/Forbidden"
  /schools/{schoolId}/assessments/history:
    get:
      summary: 查询测评历史
      tags: [Assessments]
      operationId: getAssessmentHistory
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - in: query
          name: enrollmentId
          schema:
            type: string
            format: uuid
        - in: query
          name: range
          schema:
            type: string
            enum: [8w, 6m, all]
      responses:
        "200":
          description: 测评历史
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentHistoryResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /schools/{schoolId}/assessments/history/events:
    get:
      summary: 查询测评历史事件时间线
      tags: [Assessments]
      operationId: getAssessmentHistoryEvents
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - in: query
          name: enrollmentId
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 历史事件列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentHistoryEventsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /schools/{schoolId}/teacher-invitations:
    post:
      summary: 为当前任教班级创建学生邀请码
      tags: [TeacherInvitations]
      operationId: createTeacherInvitation
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeacherInvitationRequest"
      responses:
        "201":
          description: Class-scoped teacher invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /schools/{schoolId}/teacher-invitations/mine:
    get:
      summary: 列出当前教师创建的邀请码
      tags: [TeacherInvitations]
      operationId: listMyTeacherInvitations
      parameters:
        - $ref: "#/components/parameters/SchoolId"
      responses:
        "200":
          description: Current teacher invitations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeacherInvitationResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /student/teacher-invitations/bind:
    post:
      summary: 学生绑定教师邀请码并加入目标班级
      tags: [TeacherInvitations]
      operationId: bindTeacherInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindTeacherInvitationRequest"
      responses:
        "201":
          description: Student membership and enrollment created or restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherInvitationBindResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /schools/{schoolId}/student/courses:
    get:
      summary: 获取学生可访问的已发布课程目录
      tags: [StudentCourses]
      operationId: listStudentCourses
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - { in: query, name: capabilityTheme, schema: { type: string } }
        - { in: query, name: gradeBand, schema: { type: string } }
        - { in: query, name: difficulty, schema: { type: string } }
        - {
            in: query,
            name: source,
            schema:
              {
                type: string,
                enum: [TEACHER_ASSIGNED, RECOMMENDED, SELF_STUDY],
              },
          }
        - {
            in: query,
            name: status,
            schema:
              {
                type: string,
                enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, RESULT_PENDING],
              },
          }
      responses:
        "200":
          description: Published courses visible to the current student
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "#/components/schemas/StudentCourseCatalogResponse",
                    },
                },
            }
        "403": { $ref: "#/components/responses/Forbidden" }
  /schools/{schoolId}/student/courses/{assignmentId}:
    get:
      summary: 获取学生课程树、进度、Submission 与练习引用聚合
      tags: [StudentCourses]
      operationId: getStudentCourseAggregate
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "200":
          description: Published student-safe course aggregate
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "#/components/schemas/StudentCourseAggregateResponse",
                    },
                },
            }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /schools/{schoolId}/student/courses/{assignmentId}/submissions:
    post:
      summary: 创建或恢复当前学生的课程 Submission
      tags: [StudentCourses]
      operationId: createOrResumeCourseSubmission
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "201":
          description: Course submission created or resumed
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "#/components/schemas/CourseSubmissionStartResponse",
                    },
                },
            }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /schools/{schoolId}/student/courses/{assignmentId}/submissions/{submissionId}/activities/{activityId}/attempt:
    put:
      summary: 保存课程 ActivityAttempt 并更新 ActivityProgress
      tags: [StudentCourses]
      operationId: saveCourseActivityAttempt
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/AssignmentId"
        - $ref: "#/components/parameters/SubmissionId"
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    $ref: "#/components/schemas/SaveCourseActivityAttemptRequest",
                  },
              },
          }
      responses:
        "200": { description: Attempt and progress saved }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /schools/{schoolId}/student/courses/{assignmentId}/submissions/{submissionId}/activities/{activityId}/recordings/{recordingId}/link:
    post:
      summary: 将已完成课程录音关联到 ActivityAttempt 与 Submission
      tags: [StudentCourses]
      operationId: linkCourseActivityRecording
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/AssignmentId"
        - $ref: "#/components/parameters/SubmissionId"
        - $ref: "#/components/parameters/ActivityId"
        - {
            in: path,
            name: recordingId,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "201": { description: Recording linked and progress updated }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /schools/{schoolId}/student/courses/{assignmentId}/submissions/{submissionId}/activities/{activityId}/practice-attempts/{attemptId}/complete:
    post:
      summary: 校验已提交的课程 Practice Attempt 并完成 Activity
      tags: [StudentCourses]
      operationId: completeCoursePracticeActivity
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/AssignmentId"
        - $ref: "#/components/parameters/SubmissionId"
        - $ref: "#/components/parameters/ActivityId"
        - {
            in: path,
            name: attemptId,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "201": { description: Practice Attempt linked and ActivityProgress completed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /schools/{schoolId}/student/courses/{assignmentId}/submissions/{submissionId}/submit:
    post:
      summary: 提交已完成的学生课程
      tags: [StudentCourses]
      operationId: submitStudentCourse
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/AssignmentId"
        - $ref: "#/components/parameters/SubmissionId"
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [revision],
                    properties: { revision: { type: integer, minimum: 0 } },
                  },
              },
          }
      responses:
        "201": { description: Course submitted; attainment may remain PENDING }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { description: Required course work is incomplete }
  /schools/{schoolId}/learning/activities/{activityId}/note:
    get:
      summary: 获取当前学生的私人活动笔记
      tags: [StudentCourses]
      operationId: getStudentActivityNote
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          {
            description: "Student private note, or an empty revision-zero note",
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/StudentActivityNote" },
                  },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: 以 revision 乐观并发保存当前学生私人笔记
      tags: [StudentCourses]
      operationId: saveStudentActivityNote
      parameters:
        - $ref: "#/components/parameters/SchoolId"
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [content, revision],
                    properties:
                      {
                        content: { type: string, maxLength: 10000 },
                        revision: { type: integer, minimum: 0 },
                      },
                  },
              },
          }
      responses:
        "200":
          {
            description: Note saved,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/StudentActivityNote" },
                  },
              },
          }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SchoolId:
      in: path
      name: schoolId
      required: true
      description: 学校（租户）标识
      schema:
        type: string
        format: uuid
        example: "00000000-0000-0000-0000-000000000000"
    Limit:
      in: query
      name: limit
      description: 分页返回数量上限
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      in: query
      name: cursor
      description: 游标， opaque 字符串
      schema:
        type: string
    CourseVersionId:
      in: path
      name: courseVersionId
      required: true
      description: 课程版本 ID
      schema:
        type: string
        format: uuid
    AssignmentId:
      in: path
      name: assignmentId
      required: true
      description: 任务 ID
      schema:
        type: string
        format: uuid
    ActivityId:
      in: path
      name: activityId
      required: true
      description: 学习活动 ID
      schema:
        type: string
        format: uuid
    SubmissionId:
      in: path
      name: submissionId
      required: true
      description: 提交 ID
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: 幂等键，与认证主体、路由和请求摘要绑定；重复请求返回首次业务结果，具体保留期限由服务端策略决定
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      in: header
      name: If-Match
      required: true
      description: 客户端持有的资源 revision（整数字符串形式），与服务端当前 revision 不一致时返回 409
      schema:
        type: string
    ReportId:
      in: path
      name: reportId
      required: true
      description: 报表 ID
      schema:
        type: string
        format: uuid
    EnrollmentId:
      in: path
      name: enrollmentId
      required: true
      description: 注册 ID
      schema:
        type: string
        format: uuid
    PackageId:
      in: path
      name: packageId
      required: true
      description: 离线内容包 ID
      schema:
        type: string
        format: uuid
    BatchId:
      in: path
      name: batchId
      required: true
      description: 同步批次 ID
      schema:
        type: string
        format: uuid
    ClassId:
      in: path
      name: classId
      required: true
      description: 班级 ID
      schema:
        type: string
        format: uuid
    RecordingId:
      in: path
      name: recordingId
      required: true
      description: 录音 ID
      schema:
        type: string
        format: uuid
    SessionId:
      in: path
      name: sessionId
      required: true
      description: 测评会话 ID
      schema:
        type: string
        format: uuid
    ItemId:
      in: path
      name: itemId
      required: true
      description: 测评题目 ID
      schema:
        type: string
        format: uuid
    JobId:
      in: path
      name: jobId
      required: true
      description: 语音评分任务 ID
      schema:
        type: string
        format: uuid
    AssessmentItemId:
      in: path
      name: assessmentItemId
      required: true
      description: 测评题目 ID（speech-job 查询用）
      schema:
        type: string
        format: uuid
    PartNumber:
      in: path
      name: partNumber
      required: true
      description: 录音分片序号（从 1 开始）
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: 请求参数无效或格式错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INVALID_REQUEST
              message: 请求参数无效
              details: {}
              requestId: "00000000-0000-0000-0000-000000000002"
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but outside allowed resource scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource does not exist, has been soft-deleted, or is not visible in the current school scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: State or revision conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Required dependency unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: 服务端内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    # ── P0-CONTRACT-CONVERGENCE-001: 稳定错误码响应 ──
    ValidationFailed:
      description: 参数校验失败（稳定码 VALIDATION_FAILED，HTTP 400）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_FAILED
              message: 参数校验失败
              details: {}
              requestId: "00000000-0000-0000-0000-000000000010"
    AssessmentContentEmpty:
      description: 测评内容为空——无课程/无题目/解析后为空（稳定码 PRACTICE_CONTENT_EMPTY 或 ASSESSMENT_HAS_NO_ITEMS，HTTP 422）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            practiceContentEmpty:
              value:
                error:
                  code: PRACTICE_CONTENT_EMPTY
                  message: 班级当前没有可用的练习内容，请先配置课程题目
                  details: {}
                  requestId: "00000000-0000-0000-0000-000000000011"
            assessmentHasNoItems:
              value:
                error:
                  code: ASSESSMENT_HAS_NO_ITEMS
                  message: 测评必须包含至少一道题目，无法创建空测评
                  details: {}
                  requestId: "00000000-0000-0000-0000-000000000012"
    AudioQualityRejected:
      description: 录音音质被拒——时长过短/静音/格式不支持（稳定码 AUDIO_QUALITY_REJECTED，HTTP 422）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: AUDIO_QUALITY_REJECTED
              message: 录音音质不达标，请重新录制
              details:
                durationMs: 320
                minDurationMs: 1000
              requestId: "00000000-0000-0000-0000-000000000013"
    ProviderNotConfigured:
      description: 服务提供方未配置（稳定码 PROVIDER_NOT_CONFIGURED，HTTP 503）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: PROVIDER_NOT_CONFIGURED
              message: 服务提供方未配置，该功能暂不可用
              details: {}
              requestId: "00000000-0000-0000-0000-000000000014"
    ProviderUnavailable:
      description: 服务提供方暂时不可用（稳定码 PROVIDER_UNAVAILABLE，HTTP 503）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: PROVIDER_UNAVAILABLE
              message: 语音评分服务暂时不可用，请稍后重试
              details: {}
              requestId: "00000000-0000-0000-0000-000000000015"
    ProcessingPending:
      description: 测评处理中，请稍后查询（稳定码 PROCESSING_PENDING，HTTP 202）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: PROCESSING_PENDING
              message: 测评处理中，请稍后查询
              details: {}
              requestId: "00000000-0000-0000-0000-000000000016"
    IdempotencyConflict:
      description: 幂等键冲突——重复请求与首次业务摘要不一致（稳定码 IDEMPOTENCY_CONFLICT，HTTP 409）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: IDEMPOTENCY_CONFLICT
              message: 幂等键已存在但请求摘要不一致
              details: {}
              requestId: "00000000-0000-0000-0000-000000000017"
  schemas:
    CreateTeacherInvitationRequest:
      type: object
      required: [classId]
      properties:
        classId:
          type: string
          format: uuid
        maxUses:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 90
          default: 30
    BindTeacherInvitationRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 40
    TeacherInvitationResponse:
      type: object
      required:
        [id, code, class, maxUses, usedCount, expiresAt, createdAt, status]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        class:
          $ref: "#/components/schemas/TeacherInvitationClass"
        maxUses:
          type: integer
        usedCount:
          type: integer
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [ACTIVE, REVOKED, EXPIRED, EXHAUSTED]
    TeacherInvitationClass:
      type: object
      required: [id, name, grade]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        grade:
          type: string
    TeacherInvitationBindResponse:
      type: object
      required: [alreadyBound, schoolId, class, teacherUserId, message]
      properties:
        alreadyBound:
          type: boolean
        schoolId:
          type: string
          format: uuid
        class:
          $ref: "#/components/schemas/TeacherInvitationClass"
        teacherUserId:
          type: string
          format: uuid
        message:
          type: string
    EnvelopeMeta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
        nextCursor:
          type: [string, "null"]
        hasMore:
          type: boolean
      example:
        requestId: "00000000-0000-0000-0000-000000000001"
        nextCursor: null
        hasMore: false
    ErrorBody:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
          minLength: 1
        message:
          type: string
        details:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: "null"
              - type: array
                items:
                  type: string
        requestId:
          type: string
          format: uuid
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
      example:
        error:
          code: ASSIGNMENT_NOT_OPEN
          message: 当前任务尚未开放
          details:
            assignmentId: "11111111-1111-1111-1111-111111111111"
          requestId: "00000000-0000-0000-0000-000000000003"
    Health:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        timestamp:
          type: string
          format: date-time
    HealthResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Health"
        meta:
          $ref: "#/components/schemas/EnvelopeMeta"
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
    Membership:
      type: object
      required: [schoolId, schoolName, role]
      properties:
        schoolId:
          type: string
          format: uuid
        schoolName:
          type: string
        role:
          type: string
          enum:
            [
              STUDENT,
              TEACHER,
              VOLUNTEER,
              RESEARCHER,
              SCHOOL_ADMIN,
              PLATFORM_ADMIN,
            ]
    CurrentUser:
      type: object
      required: [id, displayName, memberships]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        preferredLocale:
          type: string
          default: zh-CN
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
