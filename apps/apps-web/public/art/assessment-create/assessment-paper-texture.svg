<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="paper" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" seed="18" result="noise" />
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.72  0 0 0 0 0.66  0 0 0 0 0.56  0 0 0 .16 0" result="fibers" />
      <feGaussianBlur in="fibers" stdDeviation="0.18" result="softFibers" />
      <feBlend in="SourceGraphic" in2="softFibers" mode="multiply" />
    </filter>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffefb" />
      <stop offset="0.55" stop-color="#fbf8f1" />
      <stop offset="1" stop-color="#f8f3e9" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#warm)" filter="url(#paper)" opacity="0.92" />
  <g fill="none" stroke="#bb8d54" stroke-width="0.55" opacity="0.08">
    <path d="M-30 106C54 74 104 150 196 108S348 49 542 112" />
    <path d="M-28 334C82 291 150 381 266 335s167-44 278 4" />
  </g>
