<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>离线中｜语赞心声</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f7f2e8;
        color: #4e301b;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(
            circle at top left,
            rgba(181, 139, 42, 0.12),
            transparent 28%
          ),
          linear-gradient(180deg, rgba(124, 141, 77, 0.08), #f7f2e8);
      }
      main {
        width: min(100%, 34rem);
        padding: 2rem;
        border: 1px solid rgba(78, 48, 27, 0.12);
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.76);
        box-shadow: 0 18px 40px rgba(27, 20, 14, 0.1);
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1;
      }
      p {
        line-height: 1.7;
        margin: 0.5rem 0;
      }
    </style>
  </head>
  <body>
    <main>
      <p>OFFLINE MODE</p>
      <h1>网络暂不可用。</h1>
      <p>
        当前设备只保留了应用壳和非敏感本地草稿，实时课程与服务结果会在恢复联网后重新读取。
      </p>
      <p>
        如果你刚刚切换账号，系统会优先清理本地命名空间，避免不同账号共享缓存。
      </p>
    </main>
  </body>
</html>
