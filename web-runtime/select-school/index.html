<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择学校｜语赞心声</title><link rel="stylesheet" href="/assets/common.css"><link rel="stylesheet" href="/select-school/style.css"></head><body><div class="viewport"><main class="design select-design paper" data-width="1672" data-height="941">
<header class="header"><img class="logo brand-logo-clean" src="/assets/select-logo.png" alt="语赞心声"><div class="header-actions"><button class="btn teacher" data-nav="/teacher"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5.5 19c.5-3.8 2.6-5.8 6.5-5.8s6 2 6.5 5.8"/></svg>教师工作台</button><button class="btn btn-red start" data-nav="/login">开始学习</button></div></header>
<section class="content">
<button class="back" id="selectSchoolBack"><svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5m5-5-5 5 5 5"/></svg>返回</button>
<h1>选择本次工作的学校<span></span></h1>
<p class="privacy"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2 4.5 5v6.3c0 5 3.2 8.3 7.5 10.7 4.3-2.4 7.5-5.7 7.5-10.7V5z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg>你的权限与数据将按学校隔离</p>
<div class="table-head"><span>学校</span><span>角色</span><span>班级数</span><span>最近同步</span><span>选择</span></div>
<div class="school-list">
<button class="school-row selected" data-index="0"><strong>学校一（已脱敏）</strong><span class="role red"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><path d="M5.5 20c.5-4.7 2.7-7 6.5-7s6 2.3 6.5 7z"/></svg>教师</span><span>3 个班级</span><span class="sync">最近同步：今天 08:40 <b>✓</b></span><i class="radio"></i></button>
<button class="school-row" data-index="1"><strong>学校二（已脱敏）</strong><span class="role green"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><path d="M5.5 20c.5-4.7 2.7-7 6.5-7s6 2.3 6.5 7z"/></svg>志愿者</span><span>3 个班级</span><span class="sync">最近同步：今天 08:40 <b>✓</b></span><i class="radio"></i></button>
<button class="school-row" data-index="2"><strong>学校三（已脱敏）</strong><span class="role blue"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><path d="M5.5 20c.5-4.7 2.7-7 6.5-7s6 2.3 6.5 7z"/></svg>学生</span><span>3 个班级</span><span class="sync">最近同步：今天 08:40 <b>✓</b></span><i class="radio"></i></button>
</div>
<button class="btn btn-red continue" id="continueSchool">继续 <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h13m-5-5 5 5-5 5"/></svg></button>
<div class="path-flow" aria-label="工作路径">
<div class="flow-item red"><span class="circle"><svg class="icon" viewBox="0 0 24 24"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-5h6v5M8 12h2m4 0h2"/></svg></span><b>学校</b></div>
<div class="flow-item green"><span class="circle"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="13" rx="1"/><path d="M8 9h3m2 0h3M8 13h8M7 21l2-3m8 3-2-3"/></svg></span><b>班级</b></div>
<div class="flow-item green"><span class="circle"><svg class="icon" viewBox="0 0 24 24"><path d="M4 5.5c2.8-.7 5.3-.2 8 1.5v12c-2.7-1.7-5.2-2.2-8-1.5zM20 5.5c-2.8-.7-5.3-.2-8 1.5v12c2.7-1.7 5.2-2.2 8-1.5z"/></svg></span><b>任务</b></div>
<div class="flow-item green"><span class="circle"><svg class="icon" viewBox="0 0 24 24"><path d="M4 12h2m2-4v8m3-11v14m3-9v4m3-7v10m3-6v2"/></svg></span><b>反馈</b></div>
</div>
</section></main></div><script src="/assets/app-core.js"></script><script src="/assets/api-client.js"></script><script src="/assets/fit.js"></script><script src="/select-school/select.js"></script><script src="/global-nav.js"></script></body></html>
