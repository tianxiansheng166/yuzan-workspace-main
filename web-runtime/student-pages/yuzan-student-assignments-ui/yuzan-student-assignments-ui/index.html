<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light only" />
  <title>语赞心声｜学生任务中心</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<svg class="svg-sprite" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8v9.2a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h5a4 4 0 0 1 4 4v12H8a4 4 0 0 0-4 4z"/><path d="M20 5a2 2 0 0 0-2-2h-5a4 4 0 0 0-4 4v12h7a4 4 0 0 1 4 4z"/></symbol>
  <symbol id="i-wave" viewBox="0 0 24 24"><path d="M5 13c1.4 0 1.4-2 2.8-2s1.4 2 2.8 2 1.4-2 2.8-2 1.4 2 2.8 2 1.4-2 2.8-2"/><path d="M3 9c1.6 0 1.6-2 3.2-2s1.6 2 3.2 2 1.6-2 3.2-2 1.6 2 3.2 2 1.6-2 3.2-2"/><path d="M7 17c1.2 0 1.2-2 2.4-2s1.2 2 2.4 2 1.2-2 2.4-2 1.2 2 2.4 2"/></symbol>
  <symbol id="i-star-outline" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.1 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v10m-4-4 4 4 4-4M5 18h14"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M8 19h8a4 4 0 0 0 .8-7.9A6 6 0 0 0 6.3 9.5 4.5 4.5 0 0 0 8 19z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 3v18"/><path d="M6 4h10l-2 4 2 4H6"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M8 3v5M16 3v5M4 10h16"/></symbol>
  <symbol id="i-radio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></symbol>
  <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 0-13.6-5.7L4 9"/><path d="M4 4v5h5"/><path d="M4 12a8 8 0 0 0 13.6 5.7L20 15"/><path d="M20 20v-5h-5"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v5h5M9 12h6m-6 4h6"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 3z"/><path d="M8 10h8M8 13h5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M9 8v8a3 3 0 0 0 6 0V7a2 2 0 1 0-4 0v8a1 1 0 0 0 2 0V9"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 0 1.6 4.8"/><path d="M20 4v6h-6"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M9 9h7M9 12h7M9 15h7M6.5 9h.01M6.5 12h.01M6.5 15h.01"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l4.5-1 9-9a2.1 2.1 0 0 0-3-3l-9 9L4 20z"/><path d="m13.5 7.5 3 3"/></symbol>
  <symbol id="i-learn" viewBox="0 0 24 24"><path d="M12 5 3 9l9 4 9-4-9-4z"/><path d="M7 11v4c0 1.7 2.2 3 5 3s5-1.3 5-3v-4"/></symbol>
  <symbol id="i-test" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></symbol>
</svg>

<div class="page-shell">
  <header class="topbar">
    <div class="brand-zone">
      <a class="brand" href="#" aria-label="语赞心声">
        <img src="assets/logo-symbol.png" alt="" />
        <span class="brand-copy">
          <strong>语赞心声</strong>
          <small>用声音连接心与心</small>
        </span>
      </a>
    </div>

    <nav class="top-nav" aria-label="主导航">
      <button class="top-nav-item"><svg><use href="#i-home"/></svg><span>今日</span></button>
      <button class="top-nav-item"><svg><use href="#i-book"/></svg><span>课程</span></button>
      <button class="top-nav-item"><svg><use href="#i-wave"/></svg><span>测评</span></button>
      <button class="top-nav-item"><svg><use href="#i-star-outline"/></svg><span>成长</span></button>
      <button class="top-nav-item"><svg><use href="#i-user"/></svg><span>我的</span></button>
    </nav>

    <div class="top-actions">
      <button class="ghost-action"><svg><use href="#i-download"/></svg><span>离线管理</span></button>
      <div class="status-flag"><span class="dot"></span><span>离线可用</span></div>
      <button class="student-summary">
        <span class="student-avatar"></span>
        <span class="student-copy">
          <strong>扎西罗布</strong>
          <small>六年级</small>
        </span>
        <svg class="chev"><use href="#i-chevron-down"/></svg>
      </button>
    </div>
  </header>

  <div class="body-grid">
    <aside class="sidebar">
      <section class="profile-card">
        <span class="profile-avatar"></span>
        <div class="profile-copy">
          <h2>扎西罗布</h2>
          <p>六年级学生</p>
          <small>拉萨市城关区第一小学</small>
        </div>
      </section>

      <nav class="side-nav" aria-label="学生端导航">
        <button class="side-nav-item"><svg><use href="#i-book"/></svg><span>课程中心</span></button>
        <button class="side-nav-item"><svg><use href="#i-home"/></svg><span>我的学习</span></button>
        <button class="side-nav-item active"><svg><use href="#i-list"/></svg><span>任务</span></button>
        <button class="side-nav-item"><svg><use href="#i-download"/></svg><span>我的下载</span></button>
        <button class="side-nav-item"><svg><use href="#i-file"/></svg><span>学习记录</span></button>
        <button class="side-nav-item"><svg><use href="#i-chat"/></svg><span>教师反馈</span></button>
      </nav>

      <section class="goal-card panel">
        <div class="goal-head">
          <h3>本周学习目标</h3>
          <strong><span>2</span> / 4</strong>
        </div>
        <div class="goal-item">
          <div class="goal-label">继续学习 2 节课程</div>
          <div class="goal-progress"><i style="width:44%"></i></div>
        </div>
        <div class="goal-item">
          <div class="goal-label">完成 1 次朗读测评</div>
          <div class="goal-progress green"><i style="width:45%"></i></div>
        </div>
        <button class="goal-link">查看目标详情 <svg><use href="#i-chevron"/></svg></button>
        <div class="goal-art" aria-hidden="true"></div>
      </section>
    </aside>

    <main class="main-column">
      <section class="hero-board">
        <div class="hero-copy">
          <h1>我的任务 <svg><use href="#i-info"/></svg></h1>
          <p>按时完成任务，稳步提升语文素养</p>
        </div>
        <div class="hero-art" aria-hidden="true"></div>
      </section>

      <section class="timeline-panel">
        <div class="timeline-line" aria-hidden="true"></div>
        <div id="taskGroups" class="task-groups"></div>
        <button id="expandBtn" class="expand-more">展开更多 <svg><use href="#i-chevron-down"/></svg></button>
      </section>
    </main>

    <aside class="right-column">
      <section class="panel recommendation-card">
        <div class="panel-head simple">
          <h3>下一步建议</h3>
          <button class="icon-link" aria-label="任务建议"><svg><use href="#i-clip"/></svg></button>
        </div>
        <div class="recommend-box">
          <div class="recommend-cover"><img src="assets/task-read.png" alt="高原上的春天任务插图" /></div>
          <div class="recommend-meta">
            <span class="meta-chip warm">阅读任务</span>
            <h4>高原上的春天</h4>
            <p>语文 · 六年级下册</p>
          </div>
        </div>
        <p class="recommend-note">建议在安静环境中完成，效果更好。</p>
        <button class="primary-btn full" data-toast="已开始今日任务">立即开始</button>
        <button class="outline-btn full" data-toast="资源下载已加入队列"><svg><use href="#i-download"/></svg>下载任务资源</button>
      </section>

      <section class="panel tips-card">
        <h3>学习小贴士</h3>
        <ul>
          <li>先通读，再思考，最后回答问题。</li>
          <li>朗读时注意停顿和语气。</li>
          <li>完成后记得点击“提交”哦！</li>
        </ul>
        <div class="tips-flourish" aria-hidden="true"></div>
      </section>

      <section class="panel local-card">
        <div class="panel-head simple">
          <h3>本地任务状态</h3>
          <button class="refresh-btn" id="refreshBtn"><svg><use href="#i-refresh"/></svg><span>刷新</span></button>
        </div>
        <div class="status-list" id="localStatusList">
          <div class="status-row"><span class="status-left"><svg><use href="#i-file"/></svg>草稿任务</span><strong data-count="draft">1 个</strong></div>
          <div class="status-row"><span class="status-left waiting"><svg><use href="#i-cloud"/></svg>待同步任务</span><strong data-count="sync">1 个</strong></div>
          <div class="status-row"><span class="status-left done"><svg><use href="#i-check-circle"/></svg>已完成任务</span><strong data-count="done">3 个</strong></div>
        </div>
        <button class="manage-link">管理本地任务 <svg><use href="#i-chevron"/></svg></button>
      </section>
    </aside>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
