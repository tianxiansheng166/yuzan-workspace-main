<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>高原上的春天｜朗读</title>
  <link rel="stylesheet" href="/assets/common.css">
  <link rel="stylesheet" href="/assets/recorder.css">
  <link rel="stylesheet" href="/student/learn/spring-2/style.css">
  <link rel="stylesheet" href="/shared/student-nav.css">
</head>
<body>
<div class="viewport"><main id="player" class="design player desktop-mode" data-width="1672" data-height="941">
<section class="desktop-view">
  <aside class="path-side"><h2>学习路径</h2><div class="path-rail"></div>
    <button class="path-item completed" data-nav="/student/courses"><i>✓</i><span>第一步<br><b>词语热身</b></span></button>
    <button class="path-item active"><i>〰</i><span>第二步<br><b>朗读</b></span></button>
    <button class="path-item"><i>⚑</i><span>第三步<br><b>用自己的话表达</b></span></button>
    <img src="/assets/player-left-art.jpg" alt="学习路径山谷">
  </aside>
  <section class="lesson">
    <div class="lesson-title"><i class="live-sound-icon"><span></span><span></span><span></span><span></span><span></span></i><h2>请朗读高亮句子</h2></div>
    <p class="sentence"><mark>春风越过山脊，</mark>融雪沿着草甸汇入河谷。</p>
    <img class="mountains" src="/assets/player-mountains-desktop.png" alt="高原山脉">
    <div id="studentRecorderDesktop" class="recorder" data-voice-recorder data-storage-key="yuzan:student:spring-2" data-min-seconds="2"></div>
  </section>
  <aside class="status-side">
    <h2>资源与状态</h2><div class="status-block sync-state"><i>☁</i><p><b>已保存在本机</b><br><span>等待同步</span></p></div>
    <hr><h2>下一步</h2><div class="status-block next"><i>▱</i><p>完成当前步骤后，<br>将进入表达环节</p></div>
    <button class="complete" id="desktopComplete">完成当前录音</button>
  </aside>
</section>

</main></div>
<script src="/assets/app-core.js"></script>
<script src="/assets/api-client.js"></script>
<script src="/assets/recorder.js"></script>
<script src="/assets/fit.js"></script>
<script src="/student/learn/spring-2/player.js"></script>
<script src="/shared/student-nav.js"></script></body></html>
