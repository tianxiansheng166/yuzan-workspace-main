<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>课程中心｜语赞心声</title>
  <link rel="stylesheet" href="/assets/common.css">
  <link rel="stylesheet" href="/student/courses/style.css">
  <link rel="stylesheet" href="/shared/student-nav.css">
</head>
<body>
<div class="viewport">
  <main id="coursesDesign" class="design courses desktop-mode" data-width="1484" data-height="900">
    <section class="desktop-view">
      <aside class="left-col">
        <h1>课程中心</h1>
        <p>查看你的课程与学习进度</p>
        <div class="stats-row">
          <div class="stat-card"><b id="statTotal">-</b><span>全部课程</span></div>
          <div class="stat-card"><b id="statActive">-</b><span>进行中</span></div>
          <div class="stat-card"><b id="statDone">-</b><span>已完成</span></div>
        </div>
      </aside>

      <section class="courses-main">
        <div class="filter-bar">
          <button class="filter-btn active" data-filter="all">全部</button>
          <button class="filter-btn" data-filter="active">进行中</button>
          <button class="filter-btn" data-filter="completed">已完成</button>
          <button class="filter-btn" data-filter="not_started">未开始</button>
        </div>

        <div id="courseGrid" class="course-grid">
          <!-- 课程卡片由 JS 动态渲染 -->
          <div class="course-skeleton">
            <div class="skel-cover"></div>
            <div class="skel-body">
              <div class="skel-title"></div>
              <div class="skel-line"></div>
              <div class="skel-line short"></div>
            </div>
          </div>
          <div class="course-skeleton">
            <div class="skel-cover"></div>
            <div class="skel-body">
              <div class="skel-title"></div>
              <div class="skel-line"></div>
              <div class="skel-line short"></div>
            </div>
          </div>
          <div class="course-skeleton">
            <div class="skel-cover"></div>
            <div class="skel-body">
              <div class="skel-title"></div>
              <div class="skel-line"></div>
              <div class="skel-line short"></div>
            </div>
          </div>
        </div>

        <div id="emptyState" class="empty-state" style="display:none">
          <i>▣</i>
          <h3>暂无课程</h3>
          <p>老师还没有布置课程，请耐心等待</p>
        </div>
      </section>
    </section>
  </main>
</div>
<script src="/assets/app-core.js"></script>
<script src="/assets/api-client.js"></script>
<script src="/assets/fit.js"></script>
<script src="/student/courses/courses.js"></script>
<script src="/shared/student-nav.js"></script>
</body>
</html>
