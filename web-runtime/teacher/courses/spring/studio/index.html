<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>课程工作台｜语赞心声</title>
  <link rel="stylesheet" href="/assets/common.css">
  <link rel="stylesheet" href="/teacher/courses/spring/studio/style.css">
  <link rel="stylesheet" href="/shared/teacher-shell.css">
</head>
<body>
<div class="viewport">
  <main class="design studio" data-width="1536" data-height="1024">

    <!-- Sidebar navigation (static, links only) -->
    <aside class="sidebar">
      <img src="/assets/teacher-logo-studio.png" class="logo brand-logo-clean" alt="语赞心声">
      <nav>
        <a class="active" aria-current="page">
          <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="1"/><path d="M4 9h16M10 13h4"/></svg>
          课程工作台
        </a>
        <a data-unsupported="学习路径功能暂未开通"><svg class="icon" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><path d="M8 6h6m4 2v4m-2 4H8m-2-2v-4"/></svg>学习路径</a>
        <a href="/teacher/assessments"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-7"/></svg>智能测评</a>
        <a href="/teacher/students"><svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2"/><path d="M3 20c.5-4 2.5-6 6-6s5.5 2 6 6M14 15c3.8-.5 6 1.2 6.5 4.5"/></svg>学生管理</a>
        <a data-unsupported="资源中心功能暂未开通"><svg class="icon" viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v11H3zM7 7V4h10v3"/></svg>资源中心</a>
        <a data-unsupported="教师支持功能暂未开通"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5.5 20c.4-4.5 2.6-6.7 6.5-6.7s6.1 2.2 6.5 6.7"/></svg>教师支持</a>
        <a data-unsupported="公益与志愿功能暂未开通"><svg class="icon" viewBox="0 0 24 24"><path d="M7 11c-2.4 0-4 1.7-4 4s1.6 4 4 4c2.8 0 4.8-2.3 5-6 .2 3.7 2.2 6 5 6 2.4 0 4-1.7 4-4s-1.6-4-4-4c-2.7 0-4.7 2.1-5 5-.3-2.9-2.3-5-5-5zM12 3v6"/></svg>公益与志愿</a>
        <a data-unsupported="离线管理功能暂未开通"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="1"/><path d="m9 10 6 3-6 3z"/></svg>离线管理</a>
        <a data-unsupported="数据概览功能暂未开通"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M7 14h3v3H7zm5-6h3v9h-3zm5 3h1v6h-1"/></svg>数据概览</a>
        <a data-unsupported="消息中心功能暂未开通"><svg class="icon" viewBox="0 0 24 24"><path d="M6 10a6 6 0 0 1 12 0v5l2 2H4l2-2zM10 21h4"/></svg>消息中心</a>
        <a data-unsupported="账户设置功能暂未开通"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 15a2 2 0 0 0 .4 2.2l-2.2 2.2A2 2 0 0 0 15 19l-1 .4V22h-4v-2.6L9 19a2 2 0 0 0-2.2.4l-2.2-2.2A2 2 0 0 0 5 15l-.4-1H2v-4h2.6L5 9a2 2 0 0 0-.4-2.2l2.2-2.2A2 2 0 0 0 9 5l1-.4V2h4v2.6l1 .4a2 2 0 0 0 2.2-.4l2.2 2.2A2 2 0 0 0 19 9l.4 1H22v4h-2.6z"/></svg>账户设置</a>
      </nav>
      <div class="side-art"></div>
    </aside>

    <!-- Topbar with breadcrumb (dynamic) -->
    <header class="topbar">
      <div class="crumb">课程工作台 <span>›</span> <b data-bind="crumb-title">加载中…</b></div>
      <div class="tools">
        <span>◎</span><span class="wifi">⌁</span><span>♧</span>
        <span class="avatar"></span><span>⌄</span>
      </div>
    </header>

    <!-- Workspace (all dynamic content) -->
    <section class="workspace">

      <!-- Title row -->
      <div class="title-row">
        <h1 data-bind="course-title">加载中…</h1>
        <button class="edit" aria-label="重命名课程">✎</button>
        <span class="draft" data-bind="status-label">加载中…</span>
        <div class="title-actions">
          <button class="preview">◉　预览</button>
          <button class="submit">➤　提交审核</button>
        </div>
      </div>

      <!-- Lifecycle steps -->
      <div class="steps" data-bind="steps">
        <div class="step" data-step="DRAFT"><i>▤</i><span>课程草稿</span></div>
        <div class="line" data-line="1"></div>
        <div class="step" data-step="IN_REVIEW"><i>✎</i><b>内容完善</b></div>
        <div class="line" data-line="2"></div>
        <div class="step" data-step="APPROVED"><i>♙</i><span>教学审核</span></div>
        <div class="line" data-line="3"></div>
        <div class="step" data-step="PUBLISHED"><i>▷</i><span>发布使用</span></div>
      </div>

      <!-- Panels -->
      <div class="panels">

        <!-- Structure panel: course tree (dynamic) -->
        <section class="structure panel">
          <header><b>课程结构</b><span data-action="add-unit" title="添加章节">＋</span></header>
          <div class="tree" data-bind="structure-tree">
            <div class="tree-loading">正在加载课程结构…</div>
          </div>
          <button class="add" data-action="add-activity">＋ 添加活动</button>
        </section>

        <!-- Editor panel: activity content editor (dynamic) -->
        <section class="editor panel">
          <header class="editor-head">
            <b data-bind="editor-head">未选中活动</b>
            <span data-action="switch-activity" title="切换活动">〈　〉</span>
          </header>
          <div class="tabs">
            <button class="active" data-tab="goals">本节目标</button>
            <button data-tab="media">视频与字幕</button>
            <button data-tab="interaction">互动与练习</button>
            <button data-tab="support">教学支持</button>
            <button data-tab="offline">离线资源</button>
          </div>
          <div class="editor-body" data-bind="editor-body">
            <div class="editor-placeholder">请从左侧选择一个活动进行编辑</div>
          </div>
        </section>

        <!-- Properties panel: activity properties (dynamic) -->
        <section class="properties panel">
          <header><b>活动属性</b><span>⌃</span></header>
          <div class="prop-body" data-bind="prop-body">
            <div class="prop-placeholder">请从左侧选择一个活动</div>
          </div>
        </section>

      </div>
    </section>

    <div class="status-footer"></div>
  </main>
</div>

<script src="/assets/app-core.js"></script>
<script src="/assets/api-client.js"></script>
<script src="/assets/fit.js"></script>
<script src="/teacher/courses/spring/studio/studio.js"></script>
<script src="/global-nav.js"></script>
<script src="/shared/teacher-shell.js" defer></script>
</body>
</html>
